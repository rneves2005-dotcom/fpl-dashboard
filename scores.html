<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matchday Scores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: league sidebar + main column that switches between a multi-league score board, a league table, and a scorers chart. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#eaeef3; --line:#dde3ea;
  --ink:#131a22; --ink-2:#596673; --ink-3:#8c98a5;
  --accent:#0b8a4b; --accent-soft:#e2f3ea; --live:#e03131; --live-soft:#fdecec;
  --shadow:0 1px 2px rgba(16,28,40,.05),0 6px 18px rgba(16,28,40,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1218; --surface:#161d25; --surface-2:#1e2831; --line:#2a333d;
  --ink:#eef3f8; --ink-2:#9babba; --ink-3:#6a7784;
  --accent:#2bc274; --accent-soft:#143024; --live:#ff5c5c; --live-soft:#2a1719;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1218; --surface:#161d25; --surface-2:#1e2831; --line:#2a333d;
  --ink:#eef3f8; --ink-2:#9babba; --ink-3:#6a7784;
  --accent:#2bc274; --accent-soft:#143024; --live:#ff5c5c; --live-soft:#2a1719;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:15px; line-height:1.4; -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
.wrap{max-width:1040px; margin:0 auto; padding-left:16px; padding-right:16px}
h1{margin:0}
.flag{line-height:1; font-family:"Apple Color Emoji","Segoe UI Emoji",sans-serif}

.masthead{display:flex; align-items:baseline; gap:10px; padding-block:16px 10px; flex-wrap:wrap}
.brand{font-family:"Oswald",sans-serif; font-weight:700; font-size:25px; letter-spacing:.06em; text-transform:uppercase; line-height:1}
.brand .dot{color:var(--accent)}
.tag{color:var(--ink-3); font-size:12.5px; letter-spacing:.04em; text-transform:uppercase; font-weight:600}

.layout{display:grid; grid-template-columns:224px minmax(0,1fr); gap:18px; align-items:start; padding-bottom:40px}

/* Sidebar */
.sidebar{position:sticky; top:calc(env(safe-area-inset-top,0px) + 8px); display:flex; flex-direction:column; gap:3px; max-height:calc(100vh - 80px); overflow-y:auto; padding-right:4px}
.side-title{font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); padding:8px 8px 4px}
.lchip{display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:9px; cursor:pointer; border:1px solid transparent; background:none; color:var(--ink); font:inherit; font-size:13.5px; text-align:left; width:100%}
.lchip:hover{background:var(--surface-2)}
.lchip.active{background:var(--accent-soft); border-color:color-mix(in srgb,var(--accent) 35%,transparent); font-weight:600}
.lchip .flag{font-size:15px}
.lchip .nm{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.lchip .lv{width:7px; height:7px; border-radius:50%; background:var(--live); flex:none; animation:pulse 1.3s ease-in-out infinite}
.lchip .pin{flex:none; width:20px; height:20px; display:grid; place-items:center; border-radius:5px; font-size:13px; color:var(--ink-3); background:none; border:none; cursor:pointer}
.lchip .pin:hover{color:var(--accent); background:var(--surface)}
.lchip .pin.on{color:var(--accent)}

/* Toolbar (date + filters, scores view only) */
.toolbar{position:sticky; top:env(safe-area-inset-top,0); z-index:10; background:color-mix(in srgb,var(--bg) 88%,transparent); backdrop-filter:blur(8px); padding-block:8px; margin-bottom:8px}
.ctrl-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.date-nav{display:flex; align-items:center; gap:6px}
.nav-btn{width:34px; height:34px; display:grid; place-items:center; cursor:pointer; font-size:17px; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:9px}
.nav-btn:hover{border-color:var(--accent); color:var(--accent)}
.date-cur{position:relative; cursor:pointer; min-width:118px; text-align:center; font-family:"Oswald"; font-weight:500; line-height:1.05; padding:3px 4px}
.date-cur .d-main{font-size:15px}
.date-cur .d-sub{display:block; font-size:10px; color:var(--ink-3); letter-spacing:.07em; text-transform:uppercase; font-family:"Barlow"; font-weight:600}
.date-cur input{position:absolute; inset:0; opacity:0; cursor:pointer}
.today-btn{height:34px; padding:0 11px; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:9px; font:inherit; font-weight:600; font-size:12px; letter-spacing:.04em; text-transform:uppercase; cursor:pointer}
.today-btn[hidden]{display:none}
.filters{display:flex; gap:6px; margin-left:auto; flex-wrap:wrap}
.ftab{padding:7px 13px; border:1px solid var(--line); background:var(--surface); color:var(--ink-2); border-radius:999px; font:inherit; font-weight:600; font-size:12.5px; letter-spacing:.03em; text-transform:uppercase; cursor:pointer; display:inline-flex; align-items:center; gap:6px}
.ftab:hover{color:var(--ink)}
.ftab.active{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.ftab.live.active{background:var(--live); border-color:var(--live); color:#fff}
.ftab .cnt{font-size:11px; opacity:.85}
.toolbar.lite .date-nav,.toolbar.lite .filters,.toolbar.lite #todayBtn{display:none}

.statusline{display:flex; align-items:center; gap:8px; color:var(--ink-3); font-size:12px; padding:2px 2px 10px}
.refresh{margin-left:auto; display:inline-flex; align-items:center; gap:5px; cursor:pointer; color:var(--ink-2); background:none; border:none; font-weight:600; font-size:12px}
.refresh:hover{color:var(--accent)}
.spin{display:inline-block; width:12px; height:12px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Per-league view tabs */
.subbar{display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap}
.subbar[hidden]{display:none}
.sb-league{display:inline-flex; align-items:center; gap:8px; font-family:"Oswald"; font-weight:600; font-size:16px; letter-spacing:.02em}
.sb-league .flag{font-size:18px}
.sb-tabs{display:flex; gap:4px; margin-left:auto; background:var(--surface-2); padding:3px; border-radius:10px; border:1px solid var(--line)}
.sb-tab{padding:6px 14px; border:none; background:none; color:var(--ink-2); border-radius:8px; font:inherit; font-weight:600; font-size:13px; cursor:pointer}
.sb-tab:hover{color:var(--ink)}
.sb-tab.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}

/* Competition section (scores) */
.section{margin-bottom:14px; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); overflow:hidden}
.lhead{display:flex; align-items:center; gap:9px; padding:9px 13px; background:var(--surface-2); border-bottom:1px solid var(--line); cursor:pointer}
.lhead .cflag{font-size:16px}
.lhead .ctitle{font-family:"Oswald"; font-weight:600; font-size:13.5px; letter-spacing:.03em; text-transform:uppercase; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lhead .ctitle .co{color:var(--ink-3)}
.lhead .chev{margin-left:auto; color:var(--ink-3); font-size:12px; transition:transform .15s}
.section.collapsed .chev{transform:rotate(-90deg)}
.section.collapsed .matchlist{display:none}

.match{border-bottom:1px solid var(--line)}
.match:last-child{border-bottom:none}
.mrow{display:flex; gap:10px; padding:7px 13px; align-items:stretch}
.mstatus{flex:0 0 52px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:2px; font-family:"Oswald"; font-weight:500; font-size:12px; color:var(--ink-2); text-align:center; line-height:1.1}
.mstatus.live{color:var(--live); font-weight:600}
.mstatus .lv{width:6px; height:6px; border-radius:50%; background:var(--live); animation:pulse 1.3s ease-in-out infinite}
.mstatus .kot{font-variant-numeric:tabular-nums}
.mstatus .ko-sub{font-family:"Barlow"; font-size:9.5px; color:var(--ink-3); letter-spacing:.05em; text-transform:uppercase; font-weight:600}
.mteams{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; border-left:1px solid var(--line); padding-left:11px}
.tline{display:flex; align-items:center; gap:8px; min-width:0}
.crest{width:20px; height:20px; object-fit:contain; flex:none}
.crest-ph{width:20px; height:20px; flex:none; border-radius:50%; background:var(--surface-2); display:grid; place-items:center; font-family:"Oswald"; font-size:8px; font-weight:600; color:var(--ink-3)}
.tn{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:14px; font-weight:500}
.tline.win .tn{font-weight:700}
.tline.lose .tn{color:var(--ink-2)}
.sc{flex:none; font-family:"Oswald"; font-weight:600; font-size:16px; font-variant-numeric:tabular-nums; min-width:16px; text-align:right}
.tline.win .sc{color:var(--accent)}
.tline.lose .sc{color:var(--ink-3); font-weight:500}
.sc.pre{color:var(--ink-3); font-weight:400}
.tline.clk{cursor:pointer}
.tline.clk:hover .tn{color:var(--accent); text-decoration:underline; text-underline-offset:2px}
.mscorers{display:flex; flex-direction:column; gap:3px; padding:0 13px 9px 76px; margin-top:-2px}
.sc-line{display:flex; gap:7px; font-size:12.5px; align-items:flex-start; color:var(--ink)}
.sc-line .ab{flex:none; font-family:"Oswald"; font-weight:600; font-size:10.5px; color:var(--ink-3); min-width:30px; padding-top:1px}
.sc-line .nms{min-width:0}
.sc-line .min{color:var(--ink-2); font-variant-numeric:tabular-nums; font-weight:600}
.sc-line .mk{color:var(--ink-3); font-size:10.5px; font-weight:600}
.ball{color:var(--accent); font-size:10px}
.sc-line .jn{display:inline-block; min-width:15px; text-align:center; font-family:"Oswald"; font-weight:600; font-size:9.5px; color:var(--ink-2); background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:0 3px; line-height:14px; margin-right:4px; vertical-align:1px}

/* Tables (standings + scorers) */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); overflow:hidden; margin-bottom:14px}
.panel-head{padding:9px 14px; background:var(--surface-2); border-bottom:1px solid var(--line); font-family:"Oswald"; font-weight:600; font-size:13px; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-2)}
.tbl-scroll{overflow-x:auto}
table.t{width:100%; border-collapse:collapse; font-size:13.5px; font-variant-numeric:tabular-nums}
table.t th{font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-3); font-weight:700; padding:8px 6px; text-align:center; border-bottom:1px solid var(--line); white-space:nowrap}
table.t td{padding:8px 6px; text-align:center; border-bottom:1px solid var(--line); white-space:nowrap}
table.t tr:last-child td{border-bottom:none}
table.t .tL{text-align:left}
table.t .rk{color:var(--ink-3); font-weight:700; width:26px}
table.t .teamcell{display:flex; align-items:center; gap:9px; min-width:0; max-width:230px}
table.t .teamcell .tn2{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600}
table.t td.pts{font-weight:700; color:var(--ink)}
table.t td.gls{font-family:"Oswald"; font-weight:600; font-size:15px; color:var(--accent)}
table.t .pos-rail{box-shadow:inset 3px 0 0 var(--accent)}
table.t tr:hover td{background:var(--surface-2)}
.leg{font-size:11px; color:var(--ink-3); padding:8px 14px; display:flex; gap:14px; flex-wrap:wrap}
.leg .sw{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; background:var(--accent)}
@media (max-width:520px){ table.t .opt{display:none} }
table.t tr.clk{cursor:pointer}
table.t tr.clk:hover td{background:var(--accent-soft)}
table.t tr.grp td{background:var(--surface-2); text-align:left; font-family:"Oswald"; font-weight:600; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); padding:7px 10px}
.panel-head.ph-row{display:flex; align-items:center; gap:9px}
.panel-head.ph-row img.crest{width:22px; height:22px}
.backlink{margin-left:auto; display:inline-flex; align-items:center; gap:4px; cursor:pointer; color:var(--ink-2); background:none; border:none; font:inherit; font-weight:600; font-size:12px; text-transform:none; letter-spacing:0}
.backlink:hover{color:var(--accent)}
.hint{font-size:11px; color:var(--ink-3); padding:7px 14px 0; font-style:italic}
.phead{width:28px; height:28px; border-radius:50%; object-fit:cover; background:var(--surface-2)}
.pl-wrap{padding:14px}
.pl-bio{display:grid; grid-template-columns:1fr 1fr; gap:0 22px; margin-bottom:16px}
@media(max-width:480px){.pl-bio{grid-template-columns:1fr}}
.pl-brow{display:flex; justify-content:space-between; gap:10px; border-bottom:1px solid var(--line); padding:7px 0; font-size:13.5px}
.pl-brow .k{color:var(--ink-3); font-weight:600}
.pl-brow .v{font-weight:600; text-align:right; min-width:0}
.pl-stats-h{font-family:"Oswald"; font-weight:600; font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-3); margin-bottom:9px}
.pl-tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(84px,1fr)); gap:10px}
.pl-tile{background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:13px 8px; text-align:center; display:flex; flex-direction:column; gap:3px}
.pl-tile .n{font-family:"Oswald"; font-weight:600; font-size:24px; font-variant-numeric:tabular-nums; color:var(--ink); line-height:1}
.pl-tile.hl .n{color:var(--accent)}
.pl-tile .l{font-size:10px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-3); font-weight:600}

.note{text-align:center; color:var(--ink-2); padding:48px 16px}
.note .big{font-family:"Oswald"; font-size:20px; font-weight:600; color:var(--ink); margin-bottom:6px}
.note button{margin-top:14px; padding:9px 16px; font-weight:600; cursor:pointer; background:var(--accent); color:#fff; border:none; border-radius:9px; font:inherit}
.skeleton{height:92px; border-radius:12px; margin-bottom:12px; background:linear-gradient(100deg,var(--surface) 30%,var(--surface-2) 50%,var(--surface) 70%); background-size:200% 100%; animation:sh 1.2s linear infinite; border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.foot{text-align:center; color:var(--ink-3); font-size:11.5px; padding:6px 0 28px}
.foot a{color:var(--ink-2)}
/* lineups */
.mfoot{display:flex; justify-content:flex-end; padding:0 10px 8px}
.lnbtn{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; font:600 11px/1 "Barlow",sans-serif; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-3); background:var(--surface); border:1px solid var(--line); border-radius:999px; cursor:pointer}
.lnbtn:hover{color:var(--accent); border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.lp-wrap{display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:14px}
.lp-col{min-width:0}
.lp-head{display:flex; align-items:center; gap:8px; padding:4px 2px 9px; border-bottom:2px solid var(--line); margin-bottom:6px}
.lp-head .crest{width:26px; height:26px}
.lp-tn{font-family:"Oswald"; font-weight:600; font-size:15px; letter-spacing:.02em; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lp-form{margin-left:auto; flex:none; font-size:11px; font-weight:700; color:var(--accent); background:var(--accent-soft); padding:2px 9px; border-radius:999px; font-variant-numeric:tabular-nums}
.lp-row{display:flex; align-items:center; gap:9px; padding:5px 3px; border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent); font-size:13.5px}
.lp-j{flex:0 0 22px; text-align:center; color:var(--ink-3); font-variant-numeric:tabular-nums; font-size:12px; font-weight:600}
.lp-n{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.lp-row.off .lp-n{color:var(--ink-3)}
.lp-p{flex:none; color:var(--ink-3); font-size:10px; font-weight:700; letter-spacing:.04em}
.lp-in{flex:none; color:var(--accent); font-size:11px; font-weight:800}
.lp-out{flex:none; color:var(--live); font-size:11px; font-weight:800}
.lp-subh{margin:14px 0 2px; font-family:"Oswald"; font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3)}
.lp-list.sub .lp-n{color:var(--ink-2)}
@media (max-width:620px){ .lp-wrap{grid-template-columns:1fr; gap:4px} }

@media (max-width:760px){
  .layout{grid-template-columns:1fr; gap:10px}
  .sidebar{position:static; flex-direction:row; overflow-x:auto; overflow-y:hidden; max-height:none; gap:6px; padding:2px 0 6px; -webkit-overflow-scrolling:touch}
  .side-title{display:none}
  .lchip{width:auto; flex:none; border:1px solid var(--line); border-radius:999px; padding:6px 11px; font-size:13px}
  .lchip .pin{display:none}
  .filters{margin-left:0; width:100%; overflow-x:auto; flex-wrap:nowrap; padding-bottom:2px}
  .ftab{flex:none}
  .sb-tabs{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1 class="brand">Match<span class="dot">day</span></h1>
    <span class="tag">Scores · tables · scorers</span>
    <span style="margin-left:auto;display:flex;gap:11px;font-size:16px"><a href="nfl.html" title="NFL" style="text-decoration:none">🏈</a><a href="sports.html#nba" title="NBA" style="text-decoration:none">🏀</a><a href="sports.html#nhl" title="NHL" style="text-decoration:none">🏒</a><a href="sports.html#mlb" title="MLB" style="text-decoration:none">⚾</a><a href="f1.html" title="F1" style="text-decoration:none">🏁</a></span>
  </header>

  <div class="toolbar" id="toolbar">
    <div class="ctrl-row">
      <div class="date-nav">
        <button class="nav-btn" id="prev" aria-label="Previous day">‹</button>
        <label class="date-cur" id="datePick">
          <span class="d-main" id="dMain">Today</span>
          <span class="d-sub" id="dSub"></span>
          <input type="date" id="dateInput" aria-label="Pick a date">
        </label>
        <button class="nav-btn" id="next" aria-label="Next day">›</button>
      </div>
      <button class="today-btn" id="todayBtn" hidden>Today</button>
      <div class="filters" id="filters">
        <button class="ftab active" data-f="all">All</button>
        <button class="ftab live" data-f="live">Live <span class="cnt" id="liveCnt"></span></button>
        <button class="ftab" data-f="finished">Finished</button>
        <button class="ftab" data-f="scheduled">Scheduled</button>
      </div>
    </div>
    <div class="statusline">
      <span id="meta"></span>
      <button class="refresh" id="refreshBtn" title="Refresh">↻ Refresh</button>
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="subbar" id="subbar" hidden></div>
      <div class="sections" id="sections" aria-live="polite"></div>
    </main>
  </div>

  <div class="foot">Data: ESPN · times in your local timezone · <a href="https://www.mlssoccer.com/" target="_blank" rel="noopener">MLSsoccer.com</a></div>
</div>

<script>
"use strict";
const LEAGUES = [
  {code:"usa.1", name:"MLS", country:"USA", flag:"🇺🇸"},
  {code:"eng.1", name:"Premier League", country:"England", flag:"🏴󠁧󠁢󠁥󠁮󠁧󠁿"},
  {code:"esp.1", name:"La Liga", country:"Spain", flag:"🇪🇸"},
  {code:"ita.1", name:"Serie A", country:"Italy", flag:"🇮🇹"},
  {code:"ger.1", name:"Bundesliga", country:"Germany", flag:"🇩🇪"},
  {code:"fra.1", name:"Ligue 1", country:"France", flag:"🇫🇷"},
  {code:"bra.1", name:"Brasileirão", country:"Brazil", flag:"🇧🇷"},
  {code:"arg.1", name:"Liga Profesional", country:"Argentina", flag:"🇦🇷"},
  {code:"mex.1", name:"Liga MX", country:"Mexico", flag:"🇲🇽"},
  {code:"por.1", name:"Primeira Liga", country:"Portugal", flag:"🇵🇹"},
  {code:"ned.1", name:"Eredivisie", country:"Netherlands", flag:"🇳🇱"},

function goalMark(t){const s=(t||"").toLowerCase();if(s.includes("own"))return'<span class="mk"> (OG)</span>';if(s.includes("penalt"))return'<span class="mk"> (P)</span>';return"";}

function matchCard(ev,code){
  const comp=ev.competitions&&ev.competitions[0]; if(!comp)return"";
  const cs=comp.competitors||[]; const home=cs.find(c=>c.homeAway==="home")||cs[0]; const away=cs.find(c=>c.homeAway==="away")||cs[1];
  if(!home||!away)return"";
  const st=(comp.status&&comp.status.type)||{}; const s=st.state;
  let status;
  if(s==="in"){const clk=comp.status.displayClock||st.shortDetail||"LIVE";status=`<div class="mstatus live"><span class="lv"></span>${esc(clk)}</div>`;}
  else if(s==="post"){const d=st.shortDetail||"FT";status=`<div class="mstatus">${esc(/^FT|Full/i.test(d)?"FT":d)}</div>`;}

  const line=c=>{const other=c===home?away:home;const cls=c.winner===true?"win":(s==="post"&&other.winner===true?"lose":"");const nm=c.team.displayName||c.team.shortDisplayName||"";const sh=started?`<span class="sc">${esc(c.score!=null?c.score:"0")}</span>`:`<span class="sc pre">–</span>`;const logo=c.team.logo||(c.team.logos&&c.team.logos[0]&&c.team.logos[0].href)||"";return `<div class="tline clk ${cls}" data-league="${esc(code||"")}" data-tid="${esc(c.team.id||"")}" data-tn="${esc(nm)}" data-logo="${esc(logo)}">${crest(c.team)}<span class="tn">${esc(nm)}</span>${sh}</div>`;};
  let scorers="";
  if((comp.details||[]).some(d=>d.scoringPlay)){const rows=[away,home].map(c=>{const n=scorersFor(comp,c.team.id);return n?`<div class="sc-line"><span class="ab"><span class="ball">⚽</span> ${esc(c.team.abbreviation||"")}</span><span class="nms">${n}</span></div>`:"";}).filter(Boolean).join("");if(rows)scorers=`<div class="mscorers">${rows}</div>`;}
  const hName=home.team.displayName||home.team.shortDisplayName||"", aName=away.team.displayName||away.team.shortDisplayName||"";
  const hLogo=home.team.logo||(home.team.logos&&home.team.logos[0]&&home.team.logos[0].href)||"", aLogo=away.team.logo||(away.team.logos&&away.team.logos[0]&&away.team.logos[0].href)||"";
  const lnbtn=ev.id?`<div class="mfoot"><button class="lnbtn" data-eid="${esc(ev.id)}" data-league="${esc(code||"")}" data-hn="${esc(hName)}" data-hl="${esc(hLogo)}" data-an="${esc(aName)}" data-al="${esc(aLogo)}">⊞ Lineups</button></div>`:"";
  return `<div class="match"><div class="mrow">${status}<div class="mteams">${line(away)}${line(home)}</div></div>${scorers}${lnbtn}</div>`;
}
function liveCounts(){const per={};let total=0;for(const c in cache){const n=(cache[c]||[]).filter(e=>evState(e)==="in").length;per[c]=n;total+=n;}return{per,total};}

function renderSidebar(){

function renderScores(){
  const codes=state.active?[state.active]:orderedLeagues();
  let html="",shown=0;
  for(const code of codes){
    const l=LMAP[code]; let evs=(cache[code]||[]).filter(matchFilter);
    if(!evs.length)continue;
    const rank=e=>{const s=evState(e);return s==="in"?0:s==="pre"?1:2;};
    evs.sort((a,b)=>rank(a)-rank(b)||new Date(a.date)-new Date(b.date));

  clearTimeout(refreshTimer);

/* ---------- STANDINGS ---------- */
function statMap(entry){const m={};(entry.stats||[]).forEach(s=>m[s.name]=s.displayValue);return m;}
function standTable(entries){
  entries=entries.slice().sort((a,b)=>{
    const ra=parseInt(statMap(a).rank||"999",10), rb=parseInt(statMap(b).rank||"999",10);
    if(ra!==rb) return ra-rb;
    return parseFloat(statMap(b).points||0)-parseFloat(statMap(a).points||0);
  });
  const rows=entries.map((e,i)=>{
    const s=statMap(e); const t=e.team||{};
    const nm=t.shortDisplayName||t.displayName||"";
    const logo=(t.logos&&t.logos[0]&&t.logos[0].href)||t.logo||"";
    return `<tr class="clk" data-tid="${esc(t.id||"")}" data-tn="${esc(nm)}" data-logo="${esc(logo)}"><td class="rk pos-rail">${esc(s.rank||i+1)}</td>
      <td class="tL"><div class="teamcell">${crest(t)}<span class="tn2">${esc(nm)}</span></div></td>
      <td>${esc(s.gamesPlayed||"–")}</td>
      <td class="opt">${esc(s.wins||"0")}</td><td class="opt">${esc(s.ties||"0")}</td><td class="opt">${esc(s.losses||"0")}</td>
      <td>${esc((s.pointDifferential!=null?s.pointDifferential:"–"))}</td>
      <td class="pts">${esc(s.points||"0")}</td></tr>`;
  }).join("");
  return `<div class="tbl-scroll"><table class="t"><thead><tr><th class="rk">#</th><th class="tL">Team</th><th>P</th><th class="opt">W</th><th class="opt">D</th><th class="opt">L</th><th>GD</th><th>Pts</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function renderStandings(data){
  const l=LMAP[state.active];

  }
  sectionsEl.innerHTML=(html?`<div class="hint" style="padding-bottom:8px">Tap any team for its full squad →</div>`+html:"")||`<div class="note"><div class="big">No table</div>Nothing to show for ${esc(l.name)} right now.</div>`;

async function loadStandings(){

/* ---------- SCORERS ---------- */
async function resolveTeam(ref){
  const u=https(ref); if(teamRefCache[u])return teamRefCache[u];
  try{const t=await fetch(u).then(r=>r.json());const o={abbr:t.abbreviation||"",name:t.shortDisplayName||t.displayName||"",logo:(t.logos&&t.logos[0]&&t.logos[0].href)||""};teamRefCache[u]=o;return o;}catch(e){return{abbr:"",name:"",logo:""};}
}
async function loadScorers(){
  const code=state.active;
  if(scorerCache[code]){renderScorers(scorerCache[code]);return;}
  sectionsEl.innerHTML=`<div class="skeleton" style="height:320px"></div>`; metaEl.innerHTML=`<span class="spin"></span> Loading scorers…`;
  const yr=new Date().getFullYear(); const years=[yr,yr-1];
  let leaders=null;
  try{
    for(const y of years){
      const r=await fetch(`https://sports.core.api.espn.com/v2/sports/soccer/leagues/${code}/seasons/${y}/types/1/leaders`);
      if(!r.ok)continue; const d=await r.json();
      const gl=(d.categories||[]).find(c=>c.name==="goalsLeaders");
      if(gl&&gl.leaders&&gl.leaders.length){leaders=gl.leaders;break;}
    }
    if(!leaders){ sectionsEl.innerHTML=`<div class="note"><div class="big">No scorers chart</div>Top-scorer data isn't published for ${esc(LMAP[code].name)}.</div>`; metaEl.textContent=""; return; }
    const top=leaders.slice(0,20);
    const rows=await Promise.all(top.map(async ld=>{
      let name="",short="";
      try{const a=await fetch(https(ld.athlete.$ref)).then(r=>r.json());name=a.displayName||a.fullName||"";short=a.shortName||name;}catch(e){}
      const team=ld.team&&ld.team.$ref?await resolveTeam(ld.team.$ref):{abbr:"",name:"",logo:""};
      let assists=""; const sdv=ld.shortDisplayValue||""; const ma=sdv.match(/A:\s*(\d+)/); if(ma)assists=ma[1];
      let apps=""; const mp=sdv.match(/M:\s*(\d+)/); if(mp)apps=mp[1];
      return {name:name||"—",short,goals:Math.round(ld.value||0),assists,apps,team};
    }));
    scorerCache[code]={rows}; if(state.active===code&&state.view==="scorers") renderScorers(scorerCache[code]);
  }catch(e){ sectionsEl.innerHTML=`<div class="note"><div class="big">Couldn't load scorers</div>Try again in a moment.</div>`; metaEl.textContent=""; }
}
function renderScorers(data){

async function loadSquad(league,teamId,name,crestUrl){

function renderSquad(d){
  const team=d.team||{}; const nm=team.displayName||state.squad.name||"Squad";
  const crestU=(team.logos&&team.logos[0]&&team.logos[0].href)||state.squad.crest||"";

  const num=a=>{const n=parseInt(a.jersey,10);return isNaN(n)?999:n;};
  ath.sort((x,y)=>num(x)-num(y)||(x.displayName||"").localeCompare(y.displayName||""));
  const rows=ath.map(a=>{
    const nat=a.citizenship||(a.birthPlace&&a.birthPlace.country)||"";
    const age=(a.age!=null&&a.age!=="")?a.age:"";
    const pos=(a.position||{}).abbreviation||"";
    return `<tr class="clk" data-aid="${esc(a.id||"")}" data-an="${esc(a.displayName||"")}"><td class="rk">${esc(a.jersey||"–")}</td><td class="tL"><span class="tn2">${esc(a.displayName||"")}</span></td><td class="opt" style="color:var(--ink-3)">${esc(pos)}</td><td class="opt">${esc(nat)}</td><td>${esc(age)}</td></tr>`;
  }).join("");
  let coach=""; const c=d.coach&&d.coach[0];
  if(c){const cn=(((c.firstName||"")+" "+(c.lastName||"")).trim())||c.displayName||""; if(cn)coach=` · Mgr: ${esc(cn)}`;}
  sectionsEl.innerHTML=`<div class="panel"><div class="panel-head ph-row">${crestU?`<img class="crest" src="${esc(https(crestU))}" alt="">`:""}<span>${esc(nm)} — Squad</span><button class="backlink" id="sqBack">‹ Back to table</button></div>
    <div class="tbl-scroll"><table class="t"><thead><tr><th class="rk">#</th><th class="tL">Player</th><th class="opt">Pos</th><th class="opt">Nat</th><th>Age</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  const bk=$("#sqBack"); if(bk)bk.onclick=()=>{state.view="standings";renderView();};
  metaEl.innerHTML=`${esc(nm)} squad · ${ath.length} players${coach}`;
}

/* ---------- PLAYER PROFILE ---------- */
let playerCache={};
function backToSquad(){ state.view="squad"; renderView(); }
function statVal(stats,cat,name){ try{ const c=((stats.splits||{}).categories||[]).find(x=>x.name===cat); if(!c)return null; const s=(c.stats||[]).find(x=>x.name===name); return s?s.displayValue:null; }catch(e){return null;} }
async function loadPlayer(league,aid,name){
  if(!aid)return;
  state.view="player"; state.player={id:aid,name:name,league:league};
  renderSubbar();
  const key=league+":"+aid;
  if(playerCache[key]){renderPlayer(playerCache[key]);return;}
  sectionsEl.innerHTML=`<div class="skeleton" style="height:300px"></div>`; metaEl.innerHTML=`<span class="spin"></span> Loading ${esc(name||"player")}…`;
  const yr=new Date().getFullYear(); const years=[yr,yr-1];
  try{
    let bio=null,year=null;
    for(const y of years){
      const r=await fetch(`https://sports.core.api.espn.com/v2/sports/soccer/leagues/${league}/seasons/${y}/athletes/${aid}?lang=en&region=us`);
      if(r.ok){const j=await r.json(); if(j&&(j.fullName||j.displayName)){bio=j;year=y;break;}}
    }
    if(!bio)throw 0;
    let stats=null;
    try{const sr=await fetch(`https://sports.core.api.espn.com/v2/sports/soccer/leagues/${league}/seasons/${year}/types/1/athletes/${aid}/statistics/0?lang=en&region=us`);if(sr.ok)stats=await sr.json();}catch(e){}
    const data={bio,stats,league,year};
    playerCache[key]=data;
    if(state.view==="player"&&state.player.id===aid) renderPlayer(data);
  }catch(e){ sectionsEl.innerHTML=`<div class="note"><div class="big">Couldn't load player</div>Profile not available for ${esc(name||"this player")}.<br><button id="plBack">‹ Back to squad</button></div>`; metaEl.textContent=""; const b=$("#plBack"); if(b)b.onclick=backToSquad; }
}
function renderPlayer(data){
  const a=data.bio||{}, s=data.stats;
  const nm=a.fullName||a.displayName||state.player.name||"Player";
  const numTxt=a.jersey?`#${esc(a.jersey)}`:"";
  const pos=(a.position||{}).displayName||(a.position||{}).name||"";
  const nat=a.citizenship||"";
  const dob=a.dateOfBirth?new Date(a.dateOfBirth).toLocaleDateString([],{year:"numeric",month:"short",day:"numeric"}):"";
  const ageStr=(a.age!=null?String(a.age):"")+(dob?` · ${dob}`:"");
  const hw=[a.displayHeight,a.displayWeight].filter(Boolean).join(" / ");
  const head=a.headshot&&a.headshot.href?a.headshot.href:"";
  const teamNm=(state.squad&&state.squad.name)||"";
  const bioRows=[["Position",pos],["Shirt",numTxt],["Age",ageStr.trim()],["Height / Weight",hw],["Nationality",nat]].filter(r=>r[1]);
  const tiles=[["Apps",statVal(s,"general","appearances"),false],["Mins",statVal(s,"general","minutes"),false],["Goals",statVal(s,"offensive","totalGoals"),true],["Assists",statVal(s,"offensive","goalAssists"),true],["Shots OT",statVal(s,"offensive","shotsOnTarget"),false]];
  const yc=statVal(s,"general","yellowCards"), rc=statVal(s,"general","redCards");
  if(yc!=null||rc!=null) tiles.push(["Yel / Red",`${yc||0} / ${rc||0}`,false]);
  const shown=tiles.filter(t=>t[1]!=null);
  sectionsEl.innerHTML=`<div class="panel"><div class="panel-head ph-row">${head?`<img class="phead" src="${esc(https(head))}" alt="">`:`<span class="crest-ph" style="width:28px;height:28px;font-size:11px">${esc(a.jersey||(nm[0]||"?"))}</span>`}<span>${esc(nm)}${numTxt?" "+numTxt:""}</span><button class="backlink" id="plBack">‹ Back to squad</button></div>
    <div class="pl-wrap">
      <div class="pl-bio">${bioRows.map(r=>`<div class="pl-brow"><span class="k">${esc(r[0])}</span><span class="v">${esc(r[1])}</span></div>`).join("")}</div>
      ${shown.length?`<div class="pl-stats-h">${esc(LMAP[data.league]?LMAP[data.league].name:"")} ${esc(data.year||"")} season</div><div class="pl-tiles">${shown.map(t=>`<div class="pl-tile ${t[2]?"hl":""}"><span class="n">${esc(t[1])}</span><span class="l">${esc(t[0])}</span></div>`).join("")}</div>`:`<div class="hint" style="padding-left:0">No season stats published yet.</div>`}
    </div></div>`;
  const b=$("#plBack"); if(b)b.onclick=backToSquad;
  metaEl.innerHTML=`${esc(nm)}${teamNm?` · ${esc(teamNm)}`:""}`;
}

/* ---------- LINEUPS ---------- */
let lineupCache={};
async function loadLineups(league,eid,home,away){
  if(!league||!eid)return;
  state.view="lineups"; state.lineup={eid,league,home:home||{},away:away||{}};
  renderSubbar();
  const key=league+":"+eid;
  if(lineupCache[key]){renderLineups(lineupCache[key]);return;}
  sectionsEl.innerHTML=`<div class="skeleton" style="height:440px"></div>`; metaEl.innerHTML=`<span class="spin"></span> Loading lineups…`;
  try{
    const d=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${league}/summary?event=${eid}`,{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json();});
    lineupCache[key]=d; if(state.view==="lineups"&&state.lineup.eid===eid) renderLineups(d);
  }catch(e){ sectionsEl.innerHTML=`<div class="note"><div class="big">Couldn't load lineups</div>The data service may be momentarily unavailable.<br><button id="lnBack">‹ Back to scores</button></div>`; metaEl.textContent=""; const b=$("#lnBack"); if(b)b.onclick=()=>{state.view="scores";renderView();}; }
}
function subMin(v){ if(!v)return""; if(typeof v==="object"){const c=v.clock||v; const m=(c&&(c.displayValue||c.displayClock))||v.displayValue; return m?" "+m:"";} return ""; }
function lpRow(p){
  const a=p.athlete||{}; const nm=a.displayName||a.shortName||a.lastName||""; const j=p.jersey||"–"; const pos=((p.position||{}).abbreviation)||"";
  let mark="";
  if(p.subbedOut) mark=`<span class="lp-out" title="Subbed off">▼${esc(subMin(p.subbedOut))}</span>`;
  else if(p.subbedIn) mark=`<span class="lp-in" title="Subbed on">▲${esc(subMin(p.subbedIn))}</span>`;
  return `<div class="lp-row ${p.subbedOut?"off":""}"><span class="lp-j">${esc(j)}</span><span class="lp-n">${esc(nm)}</span>${mark}<span class="lp-p">${esc(pos)}</span></div>`;
}
function lineupCol(t){
  const team=t.team||{}; const nm=team.displayName||team.shortDisplayName||"";
  const logo=team.logo||(team.logos&&team.logos[0]&&team.logos[0].href)||"";
  const form=t.formation?`<span class="lp-form">${esc(t.formation)}</span>`:"";
  const roster=(t.roster||[]);
  const ord=(x)=>{const n=parseInt(x.formationPlace,10);return isNaN(n)?999:n;};
  const xi=roster.filter(x=>x.starter).sort((a,b)=>ord(a)-ord(b));
  const subs=roster.filter(x=>!x.starter);
  return `<div class="lp-col">
    <div class="lp-head">${logo?`<img class="crest" src="${esc(https(logo))}" alt="">`:""}<span class="lp-tn">${esc(nm)}</span>${form}</div>
    <div class="lp-list">${xi.map(lpRow).join("")}</div>
    ${subs.length?`<div class="lp-subh">Substitutes</div><div class="lp-list sub">${subs.map(lpRow).join("")}</div>`:""}
  </div>`;
}
function renderLineups(d){
  const L=state.lineup||{}; const an=(L.away&&L.away.name)||"", hn=(L.home&&L.home.name)||"";
  const back=`<button class="backlink" id="lnBack">‹ Back to scores</button>`;
  const ros=(d&&d.rosters)||[];
  const hasXI=ros.length&&ros.some(r=>(r.roster||[]).some(p=>p.starter));
  if(!hasXI){
    sectionsEl.innerHTML=`<div class="panel"><div class="panel-head ph-row"><span>${esc(an)}${an&&hn?" @ ":""}${esc(hn)} — Lineups</span>${back}</div>
      <div class="note" style="padding:40px 16px"><div class="big">Lineups not announced yet</div>Starting XIs are usually confirmed about an hour before kick-off — check back closer to the match.</div></div>`;
  } else {
    const h=ros.find(r=>r.homeAway==="home")||ros[0]; const a=ros.find(r=>r.homeAway==="away")||ros[1];
    const cols=[a,h].filter(Boolean).map(lineupCol).join("");
    sectionsEl.innerHTML=`<div class="panel"><div class="panel-head ph-row"><span>Lineups</span>${back}</div><div class="lp-wrap">${cols}</div></div>`;
  }
  const b=$("#lnBack"); if(b)b.onclick=()=>{state.view="scores";renderView();};
  metaEl.innerHTML=`${esc(an)}${an&&hn?" @ ":""}${esc(hn)} · lineups`;
}

/* ---------- dispatch ---------- */
function renderView(){
  renderSidebar(); renderSubbar();
  if(state.view==="standings"){ loadStandings(); }
  else if(state.view==="scorers"){ loadScorers(); }
  else if(state.view==="squad"){ if(state.squad){const key=state.squad.league+":"+state.squad.id; if(squadCache[key])renderSquad(squadCache[key]); else loadSquad(state.squad.league,state.squad.id,state.squad.name,state.squad.crest);} else {state.view="standings";loadStandings();} }
  else if(state.view==="player"){ if(state.player){const key=state.player.league+":"+state.player.id; if(playerCache[key])renderPlayer(playerCache[key]); else loadPlayer(state.player.league,state.player.id,state.player.name);} else backToSquad(); }
  else if(state.view==="lineups"){ if(state.lineup){const key=state.lineup.league+":"+state.lineup.eid; if(lineupCache[key])renderLineups(lineupCache[key]); else loadLineups(state.lineup.league,state.lineup.eid,state.lineup.home,state.lineup.away);} else {state.view="scores";renderScores();} }
  else { renderScores(); }
}
async function loadScores(silent){
  if(loading)return; loading=true;
  if(!silent){sectionsEl.innerHTML=`<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>`;metaEl.innerHTML=`<span class="spin"></span> Loading scores…`;}
  const dstr=ymd(state.date);
  const codes=state.active?[state.active]:LEAGUES.map(l=>l.code);
  try{
    const res=await Promise.allSettled(codes.map(code=>fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${code}/scoreboard?dates=${dstr}`,{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject(r.status))));
    if(!state.active)cache={};
    res.forEach((r,i)=>{cache[codes[i]]=(r.status==="fulfilled"&&r.value.events)?r.value.events:(cache[codes[i]]||[]);});
    renderSidebar();
    if(state.view==="scores") renderScores();
  }catch(err){ sectionsEl.innerHTML=`<div class="note"><div class="big">Couldn't load scores</div>The data service may be momentarily unavailable.<br><button id="retry">Try again</button></div>`; metaEl.textContent=""; const rb=$("#retry"); if(rb)rb.onclick=()=>loadScores(false); }
  finally{ loading=false; }
}

/* ---------- events ---------- */
function go(days){state.date=new Date(+state.date+days*864e5);setDateLabel();loadScores(false);}
$("#prev").onclick=()=>go(-1);
$("#next").onclick=()=>go(1);
$("#todayBtn").onclick=()=>{state.date=new Date();setDateLabel();loadScores(false);};
$("#dateInput").onchange=e=>{const v=e.target.value;if(!v)return;const[y,m,d]=v.split("-").map(Number);state.date=new Date(y,m-1,d);setDateLabel();loadScores(false);};
$("#datePick").onclick=e=>{if(e.target.id!=="dateInput"){const di=$("#dateInput");if(di.showPicker){try{di.showPicker();}catch(_){di.focus();}}else di.focus();}};
$("#refreshBtn").onclick=()=>{ if(state.view==="standings"){delete standCache[state.active];loadStandings();} else if(state.view==="scorers"){delete scorerCache[state.active];loadScorers();} else if(state.view==="squad"&&state.squad){const k=state.squad.league+":"+state.squad.id;delete squadCache[k];loadSquad(state.squad.league,state.squad.id,state.squad.name,state.squad.crest);} else if(state.view==="player"&&state.player){const k=state.player.league+":"+state.player.id;delete playerCache[k];loadPlayer(state.player.league,state.player.id,state.player.name);} else if(state.view==="lineups"&&state.lineup){const k=state.lineup.league+":"+state.lineup.eid;delete lineupCache[k];loadLineups(state.lineup.league,state.lineup.eid,state.lineup.home,state.lineup.away);} else loadScores(false); };
$("#filters").onclick=e=>{const b=e.target.closest(".ftab");if(!b)return;document.querySelectorAll(".ftab").forEach(x=>x.classList.toggle("active",x===b));state.filter=b.dataset.f;try{localStorage.setItem("md.filter",state.filter);}catch(_){}renderScores();};
sidebarEl.onclick=e=>{
  const pin=e.target.closest(".pin");
  if(pin){e.stopPropagation();const c=pin.dataset.pin;const i=state.pinned.indexOf(c);if(i>=0)state.pinned.splice(i,1);else state.pinned.unshift(c);savePinned();renderSidebar();return;}
  const chip=e.target.closest(".lchip"); if(!chip)return;
  if(chip.dataset.all!==undefined){ state.active=null; state.view="scores"; renderSubbar(); if(Object.keys(cache).length<LEAGUES.length) loadScores(false); else renderScores(); return; }
  const code=chip.dataset.code; state.active=code;
  if(state.view==="squad"||state.view==="player") state.view="standings";
  if(CUPS.has(code)&&state.view!=="scores") state.view="scores";
  renderView();
  if(state.view==="scores"&&!(cache[code]||[]).length) loadScores(false);
};
subbarEl.onclick=e=>{const t=e.target.closest(".sb-tab");if(!t)return;state.view=t.dataset.v;renderView();};
sectionsEl.onclick=e=>{
  const ln=e.target.closest(".lnbtn");
  if(ln&&ln.dataset.eid){ loadLineups(ln.dataset.league||state.active, ln.dataset.eid, {name:ln.dataset.hn,logo:ln.dataset.hl}, {name:ln.dataset.an,logo:ln.dataset.al}); return; }
  const tl=e.target.closest(".tline.clk");
  if(tl&&tl.dataset.tid){ loadSquad(tl.dataset.league||state.active, tl.dataset.tid, tl.dataset.tn, tl.dataset.logo); return; }
  const tr=e.target.closest("tr.clk");
  if(tr){
    if(tr.dataset.aid){ loadPlayer((state.squad&&state.squad.league)||state.active, tr.dataset.aid, tr.dataset.an); return; }
    if(tr.dataset.tid){ loadSquad(state.active, tr.dataset.tid, tr.dataset.tn, tr.dataset.logo); return; }
  }
  const h=e.target.closest(".lhead");if(!h)return;const c=h.dataset.toggle;if(state.collapsed.has(c))state.collapsed.delete(c);else state.collapsed.add(c);const sec=h.closest(".section");if(sec)sec.classList.toggle("collapsed");
};
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&state.view==="scores"&&sameDay(state.date,new Date()))loadScores(true);});

/* ---------- boot ---------- */
document.querySelectorAll(".ftab").forEach(b=>b.classList.toggle("active",b.dataset.f===state.filter));
setDateLabel();
loadScores(false);
</script>
</body>
</html>
